site_name: Database Management
site_description: 'An intelligent textbook built with AI-powered tools and interactive learning experiences.'
site_author: 'vishalsachdev'
repo_name: 'GitHub Repo'
site_url: 'https://vishalsachdev.github.io/database-management/'
repo_url: 'https://github.com/vishalsachdev/database-management'
edit_uri: 'blob/main/docs'

nav:
  - Home: index.md
  - About: about.md
  - Chapters:
    - 1. The Database Environment: chapters/01-database-environment.md
    - 2. Tables and Relational Algebra: chapters/02-tables-relational-algebra.md
    - 3. SQL Fundamentals: chapters/03-sql-fundamentals.md
    - 3b. JOINs, Subqueries & Window Functions: chapters/03b-advanced-sql.md
    - 4. Data Modeling & Normalization: chapters/04-data-modeling-normalization.md
    - 5. Python & pandas for Data: chapters/05-python-pandas.md
    - 6. ETL Pipelines: chapters/06-etl-pipelines.md
    - 7. NoSQL & APIs: chapters/07-nosql-apis.md
    - 8. Cloud Databases & Optimization: chapters/08-cloud-databases-optimization.md
  - Glossary: glossary.md
  - References: references.md
  - License: license.md

theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  palette:
    primary: 'blue'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    - navigation.footer
    - content.action.edit

plugins:
  - search
  - social
  - social_override

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.highlight:
      linenums: true

extra_css:
   - css/extra.css

extra_javascript:
    - js/extra.js

copyright: Copyright &copy; 2025 vishalsachdev. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.

extra:
  generator: false
